name: Golden Path Deploy

# The pipeline itself. Run it yourself: Actions -> Golden Path Deploy ->
# "Run workflow", then choose what the candidate build does. A healthy build
# is promoted to production; a bad one is rejected by the canary and never
# reaches it.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      error_rate:
        description: "Candidate error rate, percent (baseline is 0.2)"
        required: true
        default: "0.2"
        type: string
      latency_ms:
        description: "Candidate median latency in ms (baseline is 18)"
        required: true
        default: "18"
        type: string
      auto_approve_marginal:
        description: "Promote a MARGINAL canary without a human"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Deployments are serialised. Two pipelines promoting different versions
  # through the same environments at once is how you get a mystery outage.
  group: golden-path
  cancel-in-progress: false

jobs:
  deploy:
    name: Promote candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Resolve the candidate build
        id: candidate
        env:
          ERROR_RATE: ${{ inputs.error_rate || '0.2' }}
          LATENCY_MS: ${{ inputs.latency_ms || '18' }}
        run: |
          set -euo pipefail
          # The delivery config identifies artifacts by commit: immutable, and
          # the same artifact is promoted through every environment.
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Percent to probability for the service's ERROR_RATE setting.
          echo "error_probability=$(python -c "print(float('$ERROR_RATE') / 100)")" >> "$GITHUB_OUTPUT"
          echo "latency_ms=$LATENCY_MS" >> "$GITHUB_OUTPUT"

      - name: Run the golden path
        id: run
        run: |
          set +e
          python -m goldenpath.cli deploy \
            --candidate-version "${{ steps.candidate.outputs.version }}" \
            --baseline-version "current-production" \
            --candidate-env "ERROR_RATE=${{ steps.candidate.outputs.error_probability }}" \
            --candidate-env "LATENCY_MS=${{ steps.candidate.outputs.latency_ms }}" \
            --baseline-env "ERROR_RATE=0.002" \
            --baseline-env "LATENCY_MS=18" \
            ${{ inputs.auto_approve_marginal && '--auto-approve-marginal' || '' }} \
            --json-out artifacts/run.json \
            --markdown-out artifacts/run.md \
            --log-dir artifacts/logs
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish the run record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-path-run-${{ github.run_number }}
          path: artifacts/
          retention-days: 30

      - name: Interpret the outcome
        # The CLI's exit codes distinguish *why* a run stopped, so the job
        # reports the actual reason instead of collapsing everything into
        # "failed". A build held for human judgment is not a broken build.
        run: |
          case "${{ steps.run.outputs.exit_code }}" in
            0)
              echo "::notice title=Promoted::Passed every gate and reached production."
              ;;
            1)
              echo "::error title=Rejected by canary::A metric regressed. The run report shows which one, by how much, and with what confidence. Traffic never moved."
              exit 1
              ;;
            2)
              echo "::error title=Blocked by a constraint::A promotion constraint was not satisfied. Nothing was deployed."
              exit 1
              ;;
            3)
              echo "::warning title=Awaiting human judgment::The canary was statistically ambiguous, so the manual-judgment constraint engaged."
              exit 1
              ;;
            4)
              echo "::error title=Invalid delivery config::The delivery config failed validation."
              exit 1
              ;;
            *)
              echo "::error title=Unexpected failure::The orchestrator exited with ${{ steps.run.outputs.exit_code }}."
              exit 1
              ;;
          esac
