name: Claude

# AI operating the pipeline, in the two places it earns its keep:
#
#   1. Reviewing changes to the deployment gates before they merge.
#   2. Triaging a rejected deployment and explaining, in plain language,
#      which metric moved and what to do about it.
#
# Authentication accepts either credential, and prefers the one that does not
# add a bill:
#
#   CLAUDE_CODE_OAUTH_TOKEN  - draws on an existing Claude Pro/Max subscription.
#                              Generate with `claude setup-token`.
#   ANTHROPIC_API_KEY        - pay-per-use API billing.
#
# With neither set, every job below is skipped cleanly, so a fork or a fresh
# clone still shows a green repository rather than a wall of red.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]
  workflow_run:
    workflows: ["Golden Path Deploy"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  # Secrets are unavailable in job-level `if`, so availability is resolved
  # into an output first.
  preflight:
    name: Check credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude enabled::Authenticating with a Claude subscription token."
          elif [ -n "$API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude enabled::Authenticating with an Anthropic API key."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude disabled::Set CLAUDE_CODE_OAUTH_TOKEN (from \`claude setup-token\`, uses your subscription) or ANTHROPIC_API_KEY (pay-per-use) to enable AI review and deployment triage."
          fi

  mention:
    name: Respond to @claude
    needs: preflight
    if: |
      needs.preflight.outputs.enabled == 'true' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          # Whichever secret is set wins; the action ignores an empty input.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event.comment.body }}

  review:
    name: Review deployment-gate changes
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          # Whichever secret is set wins; the action ignores an empty input.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Review this pull request. It belongs to a deployment pipeline whose
            job is to stop bad builds reaching production, so weigh the review
            accordingly.

            Priorities, in order:

            1. **Gate integrity.** Does this change weaken a deployment gate?
               Loosened thresholds, a widened tolerance, a metric losing its
               `critical` flag, a constraint becoming unenforced, or a canary
               being skipped. If so, say so prominently and ask whether it is
               deliberate. These changes are sometimes correct, but they should
               never be silent.

            2. **Statistical correctness.** `goldenpath/canary/stats.py` and
               `judge.py` decide whether production traffic moves. Check tie
               and continuity corrections, effect-size direction, p-value
               bounds, and the handling of empty or single-element samples.

            3. **Judge parity.** `docs/site/judge.js` is a port of the Python
               judge. If one side changed and the other did not, flag it --
               `tests/test_js_parity.py` should catch it, but confirm the test
               still covers the changed path.

            4. **Fail-closed behaviour.** Missing data, an unreachable service,
               or a malformed config must never be treated as a pass.

            Be concrete and cite file and line. If the change is sound, say so
            briefly rather than manufacturing concerns.

  triage:
    name: Triage a rejected deployment
    needs: preflight
    if: |
      needs.preflight.outputs.enabled == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the run record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --dir artifacts || echo "no artifacts published for this run"
          find artifacts -type f | head -50

      - uses: anthropics/claude-code-action@v1
        with:
          # Whichever secret is set wins; the action ignores an empty input.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            {
              "allowedTools": ["Read", "Grep", "Glob", "Bash(gh issue:*)"]
            }
          prompt: |
            A Golden Path deployment run failed and did not promote its build.

            Run: ${{ github.event.workflow_run.html_url }}

            The run record is under `artifacts/` -- look for `run.json` (the
            structured result, including every metric's p-value, Cliff's delta,
            and classification), `run.md` (the rendered report), and any
            server group logs.

            Work out what actually happened and open a GitHub issue with:

            - **What stopped it**: a rejected canary, a blocked constraint, or
              a deployment error. Name the specific metric or constraint.
            - **The evidence**: canary versus baseline medians and p95s, the
              p-value, and the effect size. Quote the numbers.
            - **Whether the rejection looks correct.** This matters most. A
              genuine regression and a flaky or underpowered canary demand
              opposite responses, and saying "the canary failed" without
              distinguishing them is useless. If the effect size is large and
              the p-value tiny, the build is probably genuinely bad. If the
              sample count sits near `minSamples` or the effect is marginal,
              suspect the measurement, and say so.
            - **A recommended next step**, specific enough to act on.

            Title the issue: `Deployment rejected: <the specific reason>`.
            If an open issue already describes this same failure, comment on it
            instead of opening a duplicate.
